<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Major Club - Бронирование</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: #0f0f12; color: #ffffff; padding: 16px; }
    h2 { text-align: center; color: #00f2fe; margin-bottom: 8px; }
    .subtitle { text-align: center; font-size: 14px; color: #8a8d9b; margin-bottom: 20px; }
    .section-title { font-size: 16px; margin: 16px 0 10px; color: #ff007f; text-transform: uppercase; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .pc-card { background: #181920; border: 2px solid #282a36; border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .pc-card.selected { border-color: #00f2fe; background: #1f2235; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
    .pc-title { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
    .pc-specs { font-size: 12px; color: #a0a5b5; margin-bottom: 8px; }
    .price { font-size: 13px; color: #2ecc71; font-weight: bold; }
    .hours-selector { display: flex; gap: 8px; margin-top: 15px; }
    .hour-btn { flex: 1; background: #181920; border: 1px solid #282a36; color: white; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .hour-btn.active { background: #ff007f; border-color: #ff007f; }
    .confirm-btn { width: 100%; background: linear-gradient(45deg, #00f2fe, #4facfe); border: none; color: #000; font-weight: bold; padding: 14px; border-radius: 10px; margin-top: 20px; font-size: 16px; cursor: pointer; }
    .confirm-btn:disabled { background: #333; color: #777; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>🎮 MAJOR CLUB</h2>
  <p class="subtitle" id="user-greeting">Выбери ПК и время игры</p>

  <div class="section-title">Standard Зал</div>
  <div class="grid">
    <div class="pc-card" onclick="selectPC('PC #1 (Standard)', '150 ₽/час', this)">
      <div class="pc-title">🖥️ PC #1</div>
      <div class="pc-specs">RTX 3060 • 144Hz</div>
      <div class="price">150 ₽/час</div>
    </div>
    <div class="pc-card" onclick="selectPC('PC #2 (Standard)', '150 ₽/час', this)">
      <div class="pc-title">🖥️ PC #2</div>
      <div class="pc-specs">RTX 3060 • 144Hz</div>
      <div class="price">150 ₽/час</div>
    </div>
  </div>

  <div class="section-title">VIP Зал</div>
  <div class="grid">
    <div class="pc-card" onclick="selectPC('PC #3 VIP', '250 ₽/час', this)">
      <div class="pc-title">🔥 PC #3 VIP</div>
      <div class="pc-specs">RTX 4080 • 240Hz</div>
      <div class="price">250 ₽/час</div>
    </div>
    <div class="pc-card" onclick="selectPC('PC #4 VIP', '250 ₽/час', this)">
      <div class="pc-title">🔥 PC #4 VIP</div>
      <div class="pc-specs">RTX 4080 • 240Hz</div>
      <div class="price">250 ₽/час</div>
    </div>
  </div>

  <div class="section-title">Длительность</div>
  <div class="hours-selector">
    <button class="hour-btn active" onclick="selectHours(1, this)">1 час</button>
    <button class="hour-btn" onclick="selectHours(3, this)">3 часа</button>
    <button class="hour-btn" onclick="selectHours(5, this)">5 часов</button>
  </div>

  <button class="confirm-btn" id="submit-btn" disabled onclick="sendBooking()">Забронировать</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('user-greeting').innerText = `Игрок: ${tg.initDataUnsafe.user.first_name}`;
    }

    let selectedPCData = null;
    let selectedHoursCount = 1;

    function selectPC(name, price, element) {
      document.querySelectorAll('.pc-card').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');
      selectedPCData = { name, price };
      document.getElementById('submit-btn').disabled = false;
    }

    function selectHours(hours, element) {
      document.querySelectorAll('.hour-btn').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      selectedHoursCount = hours;
    }

    function sendBooking() {
      if (!selectedPCData) return;
      const resultText = `${selectedPCData.name} | Время: ${selectedHoursCount} ч. | Тариф: ${selectedPCData.price}`;
      tg.sendData(resultText);
      tg.close();
    }
  </script>
</body>
</html>
